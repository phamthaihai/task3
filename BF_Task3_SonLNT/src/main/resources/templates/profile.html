<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Profile · SMS</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
	<link rel="stylesheet" th:href="@{/css/sms.css}">
</head>
<body class="sms-page profile-page">
<header th:replace="~{fragments/layout :: back}"></header>

<main class="sms-main">
	<p class="profile-kicker">Your account</p>
	<h1 class="profile-title">Profile</h1>

	<section class="profile-panel">
		<div class="profile-head">
			<form class="avatar-form" th:action="@{/profile/photo}" method="post" enctype="multipart/form-data">
				<span class="avatar-badge" aria-hidden="true">
					<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
				</span>
				<label class="avatar-upload" title="Change profile photo">
					<img th:if="${hasPhoto}" th:src="@{/profile/photo}" alt="Profile photo">
					<span th:unless="${hasPhoto}" class="avatar-initial"
						  th:text="${#strings.toUpperCase(#strings.substring(user.name, 0, 1))}">U</span>
					<span class="avatar-overlay">Change</span>
					<input type="file" name="photo" accept="image/png,image/jpeg,image/gif,image/webp"
						   aria-label="Change profile photo" onchange="this.form.submit()">
				</label>
			</form>
			<div>
				<p class="profile-eyebrow">Account overview</p>
				<h2 th:text="${user.name}"></h2>
			</div>
		</div>
		<p class="notice notice-ok" th:if="${photoSuccess}" th:text="${photoSuccess}"></p>
		<p class="notice notice-error" role="alert" th:if="${photoError}" th:text="${photoError}"></p>

		<div class="profile-fields">
			<div class="field">
				<p class="field-label">Name</p>
				<p class="field-value" th:text="${user.name}"></p>
			</div>
			<div class="field">
				<p class="field-label">Email</p>
				<p class="field-value" th:text="${user.email}"></p>
			</div>
		</div>

		<section class="password-card">
			<h3>Change password</h3>
			<p class="password-sub">Enter your current password and choose a new one.</p>
			<p class="notice notice-ok" th:if="${passwordSuccess}" th:text="${passwordSuccess}"></p>
			<p class="notice notice-error" role="alert" th:if="${passwordError}" th:text="${passwordError}"></p>
			<form th:action="@{/profile/password}" method="post">
				<label for="currentPassword">Current password</label>
				<input type="password" id="currentPassword" name="currentPassword" required
					   autocomplete="current-password">

				<label for="newPassword">New password</label>
				<input type="password" id="newPassword" name="newPassword" required minlength="6"
					   autocomplete="new-password">
				<p class="hint">Use at least 6 characters.</p>

				<label for="confirmPassword">Confirm new password</label>
				<input type="password" id="confirmPassword" name="confirmPassword" required minlength="6"
					   autocomplete="new-password">

				<button type="submit" class="btn-pill-dark">Update password</button>
			</form>
		</section>
	</section>
</main>
</body>
</html>
